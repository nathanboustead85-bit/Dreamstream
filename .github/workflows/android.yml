name: Build DreamStream APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build DreamStream Ultra APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build DreamStream APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK was generated
        shell: bash
        run: |
          echo "Searching for generated APK files..."

          find app/build/outputs -type f -name "*.apk" -print

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::DreamStream APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      - name: Upload DreamStream APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamStream-Ultra-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Build summary
        shell: bash
        run: |
          echo "## DreamStream Ultra APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Android APK build completed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: DreamStream-Ultra-APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the workflow Summary page and download the APK artifact." >> "$GITHUB_STEP_SUMMARY"
